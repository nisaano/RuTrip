services:
  frontend:
    build: ./frontend
    container_name: rutrip-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - ml_module
    networks:
      - rutrip-network
    restart: unless-stopped

  backend:
    build: ./Backend
    container_name: rutrip-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      ml_module:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - rutrip-network
    restart: unless-stopped
    volumes:
      - ./Backend:/app

  ml_module:
    build: ./ml_module
    container_name: rutrip-ml
    ports:
      - "8001:8001"
    env_file:
      - .env
    networks:
      - rutrip-network
    restart: unless-stopped
    volumes:
      - ./ml_module:/app

  db:
    image: postgres:15
    container_name: rutrip-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rutrip-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rutrip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rutrip-network
    restart: unless-stopped

networks:
  rutrip-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local